<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CN Product Extractor</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <h1>CN 商品提取</h1>
      <p id="page-mode" class="page-mode" hidden></p>
      <p class="hint">商品详情页：京东 / 天猫 / 淘宝；搜索列表页：淘宝（s.taobao.com）</p>
    </header>
    <p id="unsupported-notice" class="unsupported-notice" hidden>
      请切换到<strong>商品详情页</strong>（item.jd.com / detail.tmall.com / item.taobao.com）或<strong>淘宝搜索列表页</strong>（s.taobao.com）后再操作。
    </p>
    <div class="actions item-actions" hidden>
      <button id="extract-btn" type="button">提取并写入缓存</button>
      <button id="copy-btn" type="button" disabled>复制 JSON</button>
    </div>
    <div class="actions search-actions" hidden>
      <button id="extract-list-btn" type="button" class="green" hidden>提取搜索列表</button>
    </div>
    <div class="actions secondary cache-actions">
      <button id="download-detail-btn" type="button" class="primary">统一下载全部 JSONL</button>
    </div>
    <div class="actions secondary cache-actions">
      <button id="clear-detail-btn" type="button" class="ghost">清空详情缓存</button>
    </div>
    <p id="cache-status" class="cache-status">当前缓存：详情 0 条（最多保留 10000 条）</p>
    <p id="status" class="status"></p>
    <pre id="output" class="output" aria-live="polite"></pre>
    <script src="../src/jd-page-url.js"></script>
    <script src="../src/download.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
